<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Raymond Ariwoola — People &amp; Culture Leader</title>
  <meta name="description" content="Strategic People &amp; Culture Leader with 10+ years of experience driving enterprise-wide transformation across people enablement, knowledge management, and digital innovation.">

  <meta property="og:title" content="Raymond Ariwoola — People &amp; Culture Leader">
  <meta property="og:description" content="Strategic People &amp; Culture Leader driving enterprise-wide transformation.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://raymondariwoola.com">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='4' fill='%23c9a84c'/><text x='50' y='68' font-family='Georgia' font-size='42' font-weight='bold' text-anchor='middle' fill='%230b1628'>RA</text></svg>">

  <style>
    :root,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #09090b;
    }

    body {
      overflow: hidden;
    }

    #experience-frame {
      display: block;
      width: 100%;
      height: 100vh;
      border: 0;
      opacity: 0;
      transition: opacity 0.35s ease;
    }

    #experience-frame.is-ready {
      opacity: 1;
    }

    #ra-portal {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 32px;
      background: #09090b;
      transition: opacity 0.35s ease;
    }

    #ra-portal.is-hidden {
      opacity: 0;
      pointer-events: none;
    }

    .rap-name {
      color: #f43f5e;
      font: 700 clamp(1.8rem, 5vw, 3rem)/1.2 'Arial', sans-serif;
    }

    .rap-tagline {
      color: #52525b;
      font: 0.85rem/1.2 'Arial', sans-serif;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    .rap-bar {
      width: 180px;
      height: 2px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.07);
      border-radius: 2px;
    }

    .rap-bar__fill {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #f43f5e, #f97316);
      border-radius: 2px;
      transform-origin: left;
      animation: rapBarFill 0.9s ease forwards;
    }

    @keyframes rapBarFill {
      from { transform: scaleX(0); }
      to { transform: scaleX(1); }
    }
  </style>

  <script>
    (function () {
      var pages = ['creative-dynamic/', 'corporate-polished/', 'minimal-elegant/'];
      var dest = pages[Math.floor(Math.random() * pages.length)];

      document.addEventListener('DOMContentLoaded', function () {
        var frame = document.getElementById('experience-frame');
        var portal = document.getElementById('ra-portal');

        frame.addEventListener('load', function () {
          frame.classList.add('is-ready');
          window.setTimeout(function () {
            portal.classList.add('is-hidden');
          }, 150);
        });

        frame.src = dest;
      });
    }());
  </script>
</head>
<body>
  <div id="ra-portal" role="status" aria-live="polite">
    <div class="rap-name">Raymond Ariwoola</div>
    <div class="rap-bar"><div class="rap-bar__fill"></div></div>
    <div class="rap-tagline">Loading your experience</div>
  </div>

  <iframe
    id="experience-frame"
    title="Raymond Ariwoola portfolio"
    src="about:blank"></iframe>
</body>
</html>
